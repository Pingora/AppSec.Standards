trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: windows-latest

variables:
  NEXUS_URL: https://nexus.example.com
  NEXUS_NUGET_REPOSITORY: repository/nuget-group/index.json
  NEXUS_USERNAME: ""
  NEXUS_PASSWORD: ""
  # Set NEXUS_USERNAME and NEXUS_PASSWORD as secret pipeline variables when required.

steps:
  - checkout: self

  - task: UseDotNet@2
    displayName: Set up .NET
    inputs:
      packageType: sdk
      version: "8.0.x"

  - pwsh: |
      $ErrorActionPreference = "Stop"

      $nexusNuGetUrl = "$($env:NEXUS_URL.TrimEnd('/'))/$($env:NEXUS_NUGET_REPOSITORY.Trim('/'))"

      dotnet nuget remove source nuget.org 2>$null
      dotnet nuget remove source nexus 2>$null

      if (-not [string]::IsNullOrWhiteSpace($env:NEXUS_USERNAME) -and -not [string]::IsNullOrWhiteSpace($env:NEXUS_PASSWORD)) {
        dotnet nuget add source $nexusNuGetUrl --name nexus --username $env:NEXUS_USERNAME --password $env:NEXUS_PASSWORD --store-password-in-clear-text
      } else {
        dotnet nuget add source $nexusNuGetUrl --name nexus
      }
    displayName: Configure NuGet for Nexus
    env:
      NEXUS_URL: $(NEXUS_URL)
      NEXUS_NUGET_REPOSITORY: $(NEXUS_NUGET_REPOSITORY)
      NEXUS_USERNAME: $(NEXUS_USERNAME)
      NEXUS_PASSWORD: $(NEXUS_PASSWORD)

  - pwsh: |
      $ErrorActionPreference = "Stop"

      $solution = Get-ChildItem -Path . -Filter "*.sln" -Recurse -Depth 2 | Select-Object -First 1

      if ($solution) {
        dotnet restore $solution.FullName
        dotnet build $solution.FullName --no-restore
        dotnet test $solution.FullName --no-build --verbosity normal
      } else {
        dotnet restore
        dotnet build --no-restore
        dotnet test --no-build --verbosity normal
      }
    displayName: Restore, build, and test
