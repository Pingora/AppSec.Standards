trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: windows-latest

variables:
  NEXUS_URL: https://nexus.example.com
  NEXUS_GO_REPOSITORY: repository/go-group
  GONOSUMDB: ""
  NEXUS_USERNAME: ""
  NEXUS_PASSWORD: ""
  # Set NEXUS_USERNAME and NEXUS_PASSWORD as secret pipeline variables when required.

steps:
  - checkout: self

  - task: GoTool@0
    displayName: Set up Go
    inputs:
      version: "1.22.0"

  - pwsh: |
      $ErrorActionPreference = "Stop"

      $nexusGoProxy = "$($env:NEXUS_URL.TrimEnd('/'))/$($env:NEXUS_GO_REPOSITORY.Trim('/'))/"
      go env -w GOPROXY="$nexusGoProxy"

      if (-not [string]::IsNullOrWhiteSpace($env:GONOSUMDB)) {
        go env -w GONOSUMDB="$env:GONOSUMDB"
      }

      if (-not [string]::IsNullOrWhiteSpace($env:NEXUS_USERNAME) -and -not [string]::IsNullOrWhiteSpace($env:NEXUS_PASSWORD)) {
        $hostName = ([Uri]$env:NEXUS_URL).Host
        $netrc = "machine $hostName`nlogin $env:NEXUS_USERNAME`npassword $env:NEXUS_PASSWORD`n"
        Set-Content -Path (Join-Path $env:USERPROFILE "_netrc") -Value $netrc -NoNewline -Encoding ASCII
        Set-Content -Path (Join-Path $env:USERPROFILE ".netrc") -Value $netrc -NoNewline -Encoding ASCII
      }
    displayName: Configure Go for Nexus
    env:
      NEXUS_URL: $(NEXUS_URL)
      NEXUS_GO_REPOSITORY: $(NEXUS_GO_REPOSITORY)
      GONOSUMDB: $(GONOSUMDB)
      NEXUS_USERNAME: $(NEXUS_USERNAME)
      NEXUS_PASSWORD: $(NEXUS_PASSWORD)

  - pwsh: |
      $ErrorActionPreference = "Stop"

      if (Test-Path "go.mod") {
        go mod download
      }

      go test ./...
      go build ./...
    displayName: Build and test
