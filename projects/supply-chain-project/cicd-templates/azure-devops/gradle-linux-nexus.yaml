trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  NEXUS_URL: https://nexus.example.com
  NEXUS_MAVEN_REPOSITORY: repository/maven-public
  # Set NEXUS_USERNAME and NEXUS_PASSWORD as secret pipeline variables when required.

steps:
  - checkout: self

  - task: JavaToolInstaller@0
    displayName: Set up Java
    inputs:
      versionSpec: "17"
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - script: |
      set -euo pipefail

      nexus_maven_url="${NEXUS_URL%/}/${NEXUS_MAVEN_REPOSITORY}"
      gradle_init_script="${AGENT_TEMPDIRECTORY:-/tmp}/nexus.init.gradle"

      cat > "$gradle_init_script" <<'EOF'
      def nexusUrl = System.getenv("NEXUS_MAVEN_URL")
      def nexusUser = System.getenv("NEXUS_USERNAME")
      def nexusPassword = System.getenv("NEXUS_PASSWORD") ?: ""

      def configureNexus = { repositories ->
          repositories.clear()
          repositories.maven {
              name = "nexus"
              url = uri(nexusUrl)
              if (nexusUser) {
                  credentials {
                      username = nexusUser
                      password = nexusPassword
                  }
              }
          }
      }

      def settingsRepositoriesConfigured = false
      def configureSettings = { settings ->
          configureNexus(settings.pluginManagement.repositories)
          if (settings.hasProperty("dependencyResolutionManagement")) {
              configureNexus(settings.dependencyResolutionManagement.repositories)
              settingsRepositoriesConfigured = true
          }
      }

      beforeSettings { settings ->
          configureSettings(settings)
      }

      settingsEvaluated { settings ->
          configureSettings(settings)
      }

      allprojects {
          configureNexus(buildscript.repositories)
          if (!settingsRepositoriesConfigured) {
              configureNexus(repositories)
          }
      }
      EOF

      echo "##vso[task.setvariable variable=NEXUS_MAVEN_URL]$nexus_maven_url"
      echo "##vso[task.setvariable variable=GRADLE_INIT_SCRIPT]$gradle_init_script"
    displayName: Configure Gradle for Nexus
    env:
      NEXUS_USERNAME: $(NEXUS_USERNAME)
      NEXUS_PASSWORD: $(NEXUS_PASSWORD)

  - script: |
      set -euo pipefail

      if [ -f "gradlew" ]; then
        chmod +x gradlew
        ./gradlew --init-script "$GRADLE_INIT_SCRIPT" build
      elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
        gradle --init-script "$GRADLE_INIT_SCRIPT" build
      else
        echo "No Gradle build file found."
        exit 1
      fi
    displayName: Build and test
    env:
      NEXUS_USERNAME: $(NEXUS_USERNAME)
      NEXUS_PASSWORD: $(NEXUS_PASSWORD)
