trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  NEXUS_URL: https://nexus.example.com
  NEXUS_MAVEN_REPOSITORY: repository/maven-public
  # Set NEXUS_USERNAME and NEXUS_PASSWORD as secret pipeline variables when required.

steps:
  - checkout: self

  - task: JavaToolInstaller@0
    displayName: Set up Java
    inputs:
      versionSpec: "17"
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - script: |
      set -euo pipefail

      nexus_maven_url="${NEXUS_URL%/}/${NEXUS_MAVEN_REPOSITORY}"
      mkdir -p "$HOME/.m2"

      cat > "$HOME/.m2/settings.xml" <<EOF
      <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
        <servers>
          <server>
            <id>nexus</id>
            <username>\${env.NEXUS_USERNAME}</username>
            <password>\${env.NEXUS_PASSWORD}</password>
          </server>
        </servers>
        <mirrors>
          <mirror>
            <id>nexus</id>
            <name>Nexus Maven group</name>
            <url>${nexus_maven_url}</url>
            <mirrorOf>*</mirrorOf>
          </mirror>
        </mirrors>
      </settings>
      EOF
    displayName: Configure Maven for Nexus
    env:
      NEXUS_USERNAME: $(NEXUS_USERNAME)
      NEXUS_PASSWORD: $(NEXUS_PASSWORD)

  - script: |
      set -euo pipefail

      if [ -f "mvnw" ]; then
        chmod +x mvnw
        ./mvnw -B verify
      elif [ -f "pom.xml" ]; then
        mvn -B verify
      else
        echo "No Maven build file found."
        exit 1
      fi
    displayName: Build and test
    env:
      NEXUS_USERNAME: $(NEXUS_USERNAME)
      NEXUS_PASSWORD: $(NEXUS_PASSWORD)
