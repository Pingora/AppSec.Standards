pipelines:
  default:
    - step:
        name: Maven build with Nexus on Windows
        runs-on:
          - self.hosted
          - windows
        script:
          - |
            $ErrorActionPreference = "Stop"

            if ([string]::IsNullOrWhiteSpace($env:NEXUS_URL)) { $env:NEXUS_URL = "https://nexus.example.com" }
            if ([string]::IsNullOrWhiteSpace($env:NEXUS_MAVEN_REPOSITORY)) { $env:NEXUS_MAVEN_REPOSITORY = "repository/maven-public" }
            if ($null -eq $env:NEXUS_USERNAME) { $env:NEXUS_USERNAME = "" }
            if ($null -eq $env:NEXUS_PASSWORD) { $env:NEXUS_PASSWORD = "" }

            $nexusMavenUrl = "$($env:NEXUS_URL.TrimEnd('/'))/$($env:NEXUS_MAVEN_REPOSITORY.Trim('/'))"
            $m2Dir = Join-Path $env:USERPROFILE ".m2"
            New-Item -ItemType Directory -Force -Path $m2Dir | Out-Null

            $settings = @'
            <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
              <servers>
                <server>
                  <id>nexus</id>
                  <username>${env.NEXUS_USERNAME}</username>
                  <password>${env.NEXUS_PASSWORD}</password>
                </server>
              </servers>
              <mirrors>
                <mirror>
                  <id>nexus</id>
                  <name>Nexus Maven group</name>
                  <url>__NEXUS_MAVEN_URL__</url>
                  <mirrorOf>*</mirrorOf>
                </mirror>
              </mirrors>
            </settings>
            '@

            $settings.Replace("__NEXUS_MAVEN_URL__", $nexusMavenUrl) |
              Set-Content -Path (Join-Path $m2Dir "settings.xml") -Encoding UTF8

            if (Test-Path ".\mvnw.cmd") {
              .\mvnw.cmd -B verify
            } elseif (Test-Path ".\mvnw") {
              .\mvnw -B verify
            } elseif (Test-Path "pom.xml") {
              mvn -B verify
            } else {
              Write-Error "No Maven build file found."
            }
