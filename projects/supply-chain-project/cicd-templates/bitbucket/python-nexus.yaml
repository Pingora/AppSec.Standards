image: python:3.12

pipelines:
  default:
    - step:
        name: Python build with Nexus
        caches:
          - pip
        script:
          - |
            set -eu

            NEXUS_URL="${NEXUS_URL:-https://nexus.example.com}"
            NEXUS_PYPI_REPOSITORY="${NEXUS_PYPI_REPOSITORY:-repository/pypi-group}"
            nexus_pypi_url="${NEXUS_URL%/}/${NEXUS_PYPI_REPOSITORY%/}/simple"
            export NEXUS_PYPI_URL="$nexus_pypi_url"

            python -m pip config set global.index-url "$nexus_pypi_url"

            python - <<'PY'
            import os
            import pathlib
            import stat
            from urllib.parse import urlparse

            username = os.environ.get("NEXUS_USERNAME")
            password = os.environ.get("NEXUS_PASSWORD")
            host = urlparse(os.environ["NEXUS_PYPI_URL"]).hostname

            if username and password and host:
                netrc = pathlib.Path.home() / ".netrc"
                netrc.write_text(f"machine {host}\nlogin {username}\npassword {password}\n", encoding="utf-8")
                netrc.chmod(stat.S_IRUSR | stat.S_IWUSR)
            PY

            python -m pip install --upgrade pip

            if [ -f "requirements.txt" ]; then
              python -m pip install -r requirements.txt
            fi

            if [ -f "requirements-dev.txt" ]; then
              python -m pip install -r requirements-dev.txt
            fi

            if [ -f "pyproject.toml" ] || [ -f "setup.py" ]; then
              python -m pip install .
            fi

            if python -c "import importlib.util, sys; sys.exit(0 if importlib.util.find_spec('pytest') else 1)"; then
              python -m pytest
            else
              echo "pytest is not installed; skipping tests."
            fi
