name: .NET build with Nexus

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXUS_URL: ${{ vars.NEXUS_URL || 'https://nexus.example.com' }}
  NEXUS_NUGET_REPOSITORY: ${{ vars.NEXUS_NUGET_REPOSITORY || 'repository/nuget-group/index.json' }}
  NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
  NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

jobs:
  build:
    name: Restore, build, and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Configure NuGet for Nexus
        shell: bash
        run: |
          set -euo pipefail

          nexus_nuget_url="${NEXUS_URL%/}/${NEXUS_NUGET_REPOSITORY}"

          dotnet nuget remove source nuget.org || true
          dotnet nuget remove source nexus || true

          if [ -n "${NEXUS_USERNAME:-}" ] && [ -n "${NEXUS_PASSWORD:-}" ]; then
            dotnet nuget add source "$nexus_nuget_url" \
              --name nexus \
              --username "$NEXUS_USERNAME" \
              --password "$NEXUS_PASSWORD" \
              --store-password-in-clear-text
          else
            dotnet nuget add source "$nexus_nuget_url" --name nexus
          fi

      - name: Restore, build, and test
        shell: bash
        run: |
          set -euo pipefail

          solution="$(find . -maxdepth 2 -name '*.sln' | head -n 1)"

          if [ -n "$solution" ]; then
            dotnet restore "$solution"
            dotnet build "$solution" --no-restore
            dotnet test "$solution" --no-build --verbosity normal
          else
            dotnet restore
            dotnet build --no-restore
            dotnet test --no-build --verbosity normal
          fi
