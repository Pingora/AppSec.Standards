name: Python build with Nexus

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXUS_URL: ${{ vars.NEXUS_URL || 'https://nexus.example.com' }}
  NEXUS_PYPI_REPOSITORY: ${{ vars.NEXUS_PYPI_REPOSITORY || 'repository/pypi-group' }}
  NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
  NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

jobs:
  build:
    name: Install, build, and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure pip for Nexus
        shell: bash
        run: |
          set -euo pipefail

          nexus_pypi_url="${NEXUS_URL%/}/${NEXUS_PYPI_REPOSITORY%/}/simple"
          export NEXUS_PYPI_URL="$nexus_pypi_url"

          python -m pip config set global.index-url "$nexus_pypi_url"

          python - <<'PY'
          import os
          import pathlib
          import stat
          from urllib.parse import urlparse

          username = os.environ.get("NEXUS_USERNAME")
          password = os.environ.get("NEXUS_PASSWORD")
          host = urlparse(os.environ["NEXUS_PYPI_URL"]).hostname

          if username and password and host:
              netrc = pathlib.Path.home() / ".netrc"
              netrc.write_text(f"machine {host}\nlogin {username}\npassword {password}\n", encoding="utf-8")
              netrc.chmod(stat.S_IRUSR | stat.S_IWUSR)
          PY

          echo "PIP_INDEX_URL=$nexus_pypi_url" >> "$GITHUB_ENV"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f "requirements.txt" ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f "requirements-dev.txt" ]; then
            python -m pip install -r requirements-dev.txt
          fi

          if [ -f "pyproject.toml" ] || [ -f "setup.py" ]; then
            python -m pip install .
          fi

      - name: Test
        shell: bash
        run: |
          set -euo pipefail

          if python -c "import importlib.util, sys; sys.exit(0 if importlib.util.find_spec('pytest') else 1)"; then
            python -m pytest
          else
            echo "pytest is not installed; skipping tests."
          fi
